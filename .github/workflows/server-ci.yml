name: Server CI

on:
  pull_request:
    paths:
      - "server/**"
      - "Directory.Build.props"
      - "global.json"
      - "*.slnx"
  push:
    branches: [main, dev]
    paths:
      - "server/**"
      - "Directory.Build.props"
      - "global.json"
      - "*.slnx"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore server/HunterOrder.slnx
      - run: dotnet build server/HunterOrder.slnx --no-restore --configuration Release
      - run: dotnet test server/HunterOrder.slnx --no-build --configuration Release
