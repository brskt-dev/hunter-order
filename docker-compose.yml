services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
    ports:
      - "8080:8080"
    # No database dependency yet (no functional persistence in this foundation).

  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: hunter_order
      POSTGRES_USER: hunter_order
      POSTGRES_PASSWORD: hunter_order_local
    ports:
      - "5432:5432"
    volumes:
      - hunter_order_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hunter_order -d hunter_order"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  hunter_order_postgres:
